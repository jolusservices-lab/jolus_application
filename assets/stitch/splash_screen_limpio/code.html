<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#444651",
                    "on-error-container": "#93000a",
                    "error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#ffb691",
                    "on-surface": "#1a1b21",
                    "inverse-on-surface": "#f1f0f7",
                    "surface-variant": "#e3e1e9",
                    "on-tertiary": "#ffffff",
                    "inverse-primary": "#b6c4ff",
                    "surface-dim": "#dad9e1",
                    "tertiary": "#4b1c00",
                    "on-error": "#ffffff",
                    "primary-fixed": "#dce1ff",
                    "on-secondary-fixed-variant": "#38485d",
                    "secondary": "#505f76",
                    "surface-container-high": "#e9e7ef",
                    "on-secondary": "#ffffff",
                    "surface": "#faf8ff",
                    "primary-fixed-dim": "#b6c4ff",
                    "on-tertiary-container": "#f39461",
                    "secondary-fixed-dim": "#b7c8e1",
                    "surface-container-low": "#f4f3fa",
                    "on-secondary-fixed": "#0b1c30",
                    "outline-variant": "#c5c5d3",
                    "on-primary-container": "#90a8ff",
                    "inverse-surface": "#2f3036",
                    "surface-tint": "#4059aa",
                    "on-tertiary-fixed-variant": "#773205",
                    "error": "#ba1a1a",
                    "secondary-fixed": "#d3e4fe",
                    "on-background": "#1a1b21",
                    "secondary-container": "#d0e1fb",
                    "on-primary-fixed-variant": "#264191",
                    "tertiary-fixed": "#ffdbcb",
                    "background": "#faf8ff",
                    "on-primary-fixed": "#00164e",
                    "surface-container-lowest": "#ffffff",
                    "surface-container": "#eeedf4",
                    "primary-container": "#1e3a8a",
                    "on-tertiary-fixed": "#341100",
                    "surface-bright": "#faf8ff",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#e3e1e9",
                    "primary": "#00236f",
                    "tertiary-container": "#6e2c00",
                    "outline": "#757682",
                    "on-secondary-container": "#54647a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "12px",
                    "margin": "20px",
                    "base": "4px",
                    "xs": "8px",
                    "gutter": "16px",
                    "xl": "32px",
                    "lg": "24px",
                    "2xl": "48px",
                    "md": "16px"
            },
            "fontFamily": {
                    "body-md": ["Manrope"],
                    "h3": ["Manrope"],
                    "label-sm": ["Inter"],
                    "body-lg": ["Manrope"],
                    "h2": ["Manrope"],
                    "h1": ["Manrope"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "h3": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "h2": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "h1": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-image: radial-gradient(circle at 2px 2px, #e2e8f0 1px, transparent 0);
            background-size: 40px 40px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest font-body-md text-on-surface antialiased overflow-hidden">
<!-- Splash Screen Container -->
<main class="relative min-h-screen w-full flex flex-col items-center justify-center bg-white overflow-hidden">
<!-- Subtle Background Pattern/Gradient -->
<div class="absolute inset-0 bg-pattern opacity-40 pointer-events-none"></div>
<div class="absolute inset-0 bg-gradient-to-tr from-primary-fixed/10 via-transparent to-tertiary-fixed/5 pointer-events-none"></div>
<!-- Central Content Area -->
<div class="relative z-10 flex flex-col items-center text-center px-margin">
<!-- Logo Icon with Glass Effect Container -->
<div class="mb-lg p-md rounded-xl bg-white shadow-sm border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[64px] text-primary" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">
                    auto_awesome
                </span>
</div>
<!-- Brand Identity -->
<div class="space-y-xs">
<h1 class="font-h1 text-h1 text-primary tracking-tight">
                    Jolus Services
                </h1>
<p class="font-label-md text-label-md text-secondary tracking-widest uppercase">
                    Premium Event Management
                </p>
</div>
</div>
<!-- Bottom Loading Experience Section -->
<div class="absolute bottom-2xl left-0 w-full flex flex-col items-center gap-md px-margin">
<!-- Loading Indicator (Progress Bar Style) -->
<div class="w-48 h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/3 rounded-full"></div>
</div>
<!-- Loading Text -->
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]" data-icon="sync" style="font-variation-settings: 'wght' 600;">
                    sync
                </span>
                Cargando experiencia premium...
            </p>
</div>
<!-- Decorative Elements for Corporate Polish -->
<div class="absolute top-0 right-0 p-xl">
<div class="w-32 h-32 border-t-2 border-r-2 border-primary-fixed/20 rounded-tr-[40px]"></div>
</div>
<div class="absolute bottom-0 left-0 p-xl">
<div class="w-32 h-32 border-b-2 border-l-2 border-primary-fixed/20 rounded-bl-[40px]"></div>
</div>
</main>
</body></html>
